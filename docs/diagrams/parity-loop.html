<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parity verification loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · rust-stdlib</p>
    <h1>Parity verification loop</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parity-loop-title parity-loop-desc">
        <title id="parity-loop-title">rust-stdlib parity verification loop</title>
        <desc id="parity-loop-desc">A package's check script sends one seeded request corpus to the real Go 1.27 oracle and to the Rust probe, compares their outputs line by line, and feeds the result to tools/check.py, which also runs api_parity.py over the docs/api symbol maps that build docs/COVERAGE.md.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- Lane tints and dividers -->
        <rect x="0" y="64" width="960" height="112" fill="rgba(45,49,66,0.018)"/>
        <rect x="0" y="288" width="960" height="112" fill="rgba(45,49,66,0.018)"/>
        <line x1="0" y1="64" x2="960" y2="64" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="176" x2="960" y2="176" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="288" x2="960" y2="288" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="400" x2="960" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="512" x2="960" y2="512" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="120" y1="64" x2="120" y2="512" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

        <!-- Step header -->
        <rect x="204" y="16" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
        <text x="220" y="27" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">01</text>
        <text x="220" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">INPUTS</text>
        <rect x="404" y="16" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
        <text x="420" y="27" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">02</text>
        <text x="420" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">RUN</text>
        <rect x="604" y="16" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
        <text x="620" y="27" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">03</text>
        <text x="620" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">COMPARE</text>
        <rect x="804" y="16" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
        <text x="820" y="27" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">04</text>
        <text x="820" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">GATE</text>

        <!-- Lane labels -->
        <text x="80" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">GO 1.27</text>
        <text x="80" y="130" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">REFERENCE</text>
        <text x="80" y="230" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">PYTHON</text>
        <text x="80" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">HARNESS</text>
        <text x="80" y="342" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">RUST</text>
        <text x="80" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">UNDER TEST</text>
        <text x="80" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">DOCS</text>
        <text x="80" y="466" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">SYMBOL MAPS</text>

        <!-- Connectors first, so nodes paint over their ends -->
        <!-- corpus -> Go oracle and Rust probe: the same requests on stdin -->
        <path d="M 300,216 H 412 Q 420,216 420,208 V 164" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
        <path d="M 300,248 H 412 Q 420,248 420,256 V 300" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
        <!-- Go oracle -> compare: the focal hand-off, Go's output is the expected value -->
        <path d="M 500,120 H 612 Q 620,120 620,128 V 188" stroke="#bf4520" stroke-width="1.2" fill="none" marker-end="url(#arrow-accent)"/>
        <rect x="528" y="100" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="554" y="109" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EXPECTED</text>
        <!-- Rust probe -> compare -->
        <path d="M 500,344 H 612 Q 620,344 620,336 V 276" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
        <!-- compare -> gate -->
        <line x1="700" y1="232" x2="740" y2="232" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
        <!-- symbol map -> scoreboard -->
        <line x1="300" y1="456" x2="540" y2="456" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
        <!-- scoreboard -> gate (api_parity.py --check) -->
        <path d="M 700,456 H 812 Q 820,456 820,448 V 276" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

        <!-- Request corpus -->
        <rect x="140" y="188" width="160" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="140" y="188" width="160" height="88" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="148" y="196" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="162.0" y="205" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PY</text>
        <text x="220" y="230" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Request corpus</text>
        <text x="220" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">seeded, mutated inputs</text>
        <text x="220" y="264" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tools/&lt;pkg&gt;_check.py</text>

        <!-- Symbol map -->
        <rect x="140" y="412" width="160" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="140" y="412" width="160" height="88" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="148" y="420" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="162.0" y="429" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DOC</text>
        <text x="220" y="454" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Symbol map</text>
        <text x="220" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mapped/deviation/differs</text>
        <text x="220" y="488" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">docs/api/&lt;pkg&gt;.json</text>

        <!-- Go oracle -->
        <rect x="340" y="76" width="160" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="76" width="160" height="88" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="348" y="84" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="362.0" y="93" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GO</text>
        <text x="420" y="118" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Go oracle</text>
        <text x="420" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">real Go 1.27 stdlib</text>
        <text x="420" y="152" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tools/&lt;pkg&gt;_oracle.go</text>

        <!-- Rust probe -->
        <rect x="340" y="300" width="160" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="340" y="300" width="160" height="88" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="348" y="308" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="362.0" y="317" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RS</text>
        <text x="420" y="342" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Rust probe</text>
        <text x="420" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the crate under test</text>
        <text x="420" y="376" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">examples/&lt;pkg&gt;_probe.rs</text>

        <!-- Compare -->
        <rect x="540" y="188" width="160" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="540" y="188" width="160" height="88" rx="6" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="548" y="196" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="562.0" y="205" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PY</text>
        <text x="620" y="230" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Compare</text>
        <text x="620" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">every line against Go</text>
        <text x="620" y="264" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tools/&lt;pkg&gt;_check.py</text>

        <!-- Scoreboard -->
        <rect x="540" y="412" width="160" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="540" y="412" width="160" height="88" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="548" y="420" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="562.0" y="429" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DOC</text>
        <text x="620" y="454" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Scoreboard</text>
        <text x="620" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">writes docs/COVERAGE.md</text>
        <text x="620" y="488" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tools/api_parity.py</text>

        <!-- Gate -->
        <rect x="740" y="188" width="160" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="740" y="188" width="160" height="88" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <rect x="748" y="196" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="762.0" y="205" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PY</text>
        <text x="820" y="230" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Gate</text>
        <text x="820" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">via tools/parity_check.py</text>
        <text x="820" y="264" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">python3 tools/check.py</text>

        <!-- Legend strip -->
        <text x="40" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <line x1="120" y1="541" x2="148" y2="541" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="156" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Requests, outputs, results</text>
        <line x1="320" y1="541" x2="348" y2="541" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="356" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Go's output is the expected value</text>
        <rect x="548" y="535" width="16" height="12" rx="2" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="572" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Compare: an unexplained mismatch fails the suite</text>
      </svg>
    </div>
  </div>
</body>
</html>
