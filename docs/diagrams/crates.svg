        <path d="M 260,296 V 320 Q 260,328 268,328 H 308 Q 316,328 316,336 V 360" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#crates-arrow)"/>
        <!-- crypto -> RustCrypto -->
        <line x1="830" y1="176" x2="830" y2="240" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#crates-arrow)"/>

