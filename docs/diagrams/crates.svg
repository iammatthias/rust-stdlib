        <line x1="280" y1="176" x2="280" y2="240" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#crates-arrow)" stroke-dasharray="5,4"/>
        <rect x="204" y="202" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="238" y="211" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TLS FEATURE</text>
