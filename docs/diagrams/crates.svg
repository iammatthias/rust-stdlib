        <line x1="376" y1="176" x2="376" y2="360" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#crates-arrow)"/>
        <!-- sysnet -> sys -->
        <line x1="424" y1="176" x2="424" y2="240" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#crates-arrow)"/>
        <!-- tls -> rustls -->
        <line x1="180" y1="296" x2="180" y2="360" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#crates-arrow)"/>
