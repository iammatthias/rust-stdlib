        <text x="130.0" y="396" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">rustls + ring</text>
        <text x="130.0" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">rustls 0.23.46 · 25 crates</text>

