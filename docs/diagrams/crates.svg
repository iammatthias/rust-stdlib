        <text x="830.0" y="156" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">rust-stdlib-crypto</text>
        <text x="830.0" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">crates/crypto · ADR 0003</text>

