        <rect x="548" y="524" width="16" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="3,2" fill-opacity="0.05" stroke-opacity="0.70"/>
        <text x="572" y="533" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The only unsafe code: libc FFI</text>
        <line x1="748" y1="530" x2="776" y2="530" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
