        <rect x="264" y="246" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="278" y="255" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">1 IN</text>
        <text x="210.0" y="276" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">rust-stdlib-tls</text>
        <text x="210.0" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">backends/tls · ADR 0002</text>

        <!-- rust-stdlib-sys -->
        <rect x="412" y="240" width="180" height="56" rx="6" fill="#f5f5f5"/>
