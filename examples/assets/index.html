<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
body { font: 17px/1.55 system-ui, sans-serif; max-width: 42rem; margin: 4rem auto; padding: 0 1rem; }
label { display: block; } input, button { font: inherit; padding: .55rem; } pre { white-space: pre-wrap; }
</style>
<h1>{{title}}</h1>
<p>This page is embedded in the executable. The server, JSON codec, router, and logger use the first-party library and Rust’s standard library.</p>
<form id="echo"><label for="message">Message</label><input id="message" name="message" value="hello" maxlength="1024" required><button>Send</button></form>
<pre id="result" aria-live="polite"></pre>
<script>
const form = document.getElementById('echo');
const output = document.getElementById('result');
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = form.querySelector('button');
  button.disabled = true;
  try {
    const response = await fetch('/echo', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: document.getElementById('message').value })
    });
    const text = await response.text();
    if (!response.ok) throw new Error(`${response.status}: ${text}`);
    output.textContent = JSON.stringify(JSON.parse(text), null, 2);
  } catch (error) { output.textContent = String(error); }
  finally { button.disabled = false; }
});
</script>
</html>
